<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PenTools - Tools for Everything.</title>
<meta name="description" content="PenTools: Simple tools. Smarter workflow.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%2389E900' d='M8 4h10a8 8 0 010 16h-4v8H8z'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar" id="bar"></div>

<header class="nav">
  <a class="brand" href="#/"><span data-logo></span>PenTools</a>
  <div class="nav-actions">
    <button class="icon-btn" id="btnSearch" aria-label="Cari" data-icon="search"></button>
    <button class="icon-btn" id="btnSettings" aria-label="Pengaturan" data-icon="settings"></button>
  </div>
</header>

<!-- Konten dirender oleh script.js (home / halaman tool) -->
<main id="app"></main>

<footer class="foot">
  <a class="brand" href="#/"><span data-logo></span>PenTools</a>
  <p class="muted">Simple tools. Smarter workflow.</p>
  <p class="muted small">Versi <span class="ver"></span> &middot; &copy; 2026 PenTools</p>
</footer>

<!-- Modal Pengaturan -->
<div class="overlay" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-label="Pengaturan">
    <div class="modal-h"><h2>Pengaturan</h2><button class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
    <div class="fld">Primary Color
      <div class="row"><input type="color" id="pPick" aria-label="Primary color"><input class="in" id="pHex" maxlength="7" spellcheck="false"></div></div>
    <div class="fld">Secondary Color
      <div class="row"><input type="color" id="sPick" aria-label="Secondary color"><input class="in" id="sHex" maxlength="7" spellcheck="false"></div></div>
    <label class="check"><input type="checkbox" id="reduce"> Kurangi animasi</label>
    <div class="row"><button class="btn ghost" id="reset">Reset Default</button></div>
    <p class="muted small">PenTools v<span class="ver"></span>. Semua proses berjalan di browser Anda; tidak ada data yang diunggah.</p>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
